<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a121e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="https://cdn.phototourl.com/free/2026-08-30-c218c141-154a-4354-983e-1d187be89cde.webp">
<link rel="icon" href="https://cdn.phototourl.com/free/2026-08-30-c218c141-154a-4354-983e-1d187be89cde.webp">
<title>Department Command — LSPD</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-shell" id="loginScreen">
  <div class="login-card">
    <img class="logo" style="width:44px;height:44px;margin:0 auto 16px;display:block;" src="https://cdn.phototourl.com/free/2026-08-30-c218c141-154a-4354-983e-1d187be89cde.webp" alt="LSPD">
    <h1>Department Command</h1>
    <p class="sub">Accesso riservato al personale autorizzato</p>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="loginBtn">Accedi</button>
      <div class="err-msg" id="errMsg"></div>
    </form>
  </div>
</div>

<div class="login-shell" id="dashboardScreen" style="display:none; align-items:flex-start;">
  <div class="dash" style="width:100%; padding-top:20px;">
    <div class="dash-head">
      <div>
        <h1>Department Command</h1>
        <div class="who">Connesso come <strong id="whoUser"></strong></div>
      </div>
      <a href="#" class="logout-link" id="logoutBtn">Esci</a>
    </div>

    <h2 style="font-size:1.05rem; font-weight:600; margin:0 0 14px;">Candidature ricevute</h2>
    <div id="appsList">
      <div class="empty-state">Caricamento candidature…</div>
    </div>
  </div>
</div>

<script src="command.js"></script>
</body>
</html>
